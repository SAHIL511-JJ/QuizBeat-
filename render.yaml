# Render Blueprint Configuration
services:
  - type: web
    name: studyquiz-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: MCP_LOGIN_CODE_TTL_MINUTES
        value: 10
      - key: MCP_SESSION_TTL_DAYS
        value: 7
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
